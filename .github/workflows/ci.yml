name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest   # Docker is available here, so Testcontainers just works
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & test
        run: |
          if [ ! -f pom.xml ]; then
            echo "::warning::No pom.xml yet - create the Spring Boot project (see README). CI will run tests once it exists."
            exit 0
          fi
          ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always() && hashFiles('target/surefire-reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
